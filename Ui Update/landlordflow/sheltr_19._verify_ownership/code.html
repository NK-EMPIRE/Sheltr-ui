<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Sheltr - Verify Ownership</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            coral: {
              DEFAULT: '#EF6E58',
              50: '#FDF6F4',
              100: '#FCECE8',
              500: '#EF6E58',
              600: '#DF5E48',
            },
            surface: '#FAFAFA',
            subtle: '#6B7280',
            primaryText: '#18181B',
            borderLight: '#F3F4F6'
          }
        }
      }
    }
  </script>
<style data-purpose="base-typography">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #F4F4F5;
    }
  </style>
<style data-purpose="layout-mobile">
    /* Device frame simulator wrapper for desktop preview */
    .mobile-screen {
      width: 100%;
      max-width: 390px;
      min-height: 844px;
      background-color: #FFFFFF;
      margin: 0 auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen text-primaryText">
<!-- BEGIN: MobileScreenContainer -->
<div class="mobile-screen shadow-2xl relative overflow-hidden" data-purpose="screen-wrapper">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-6 flex justify-between items-center text-xs font-semibold z-10" data-purpose="ios-status-bar">
<!-- Time -->
<span class="tracking-tight text-neutral-900 font-bold text-sm">9:41</span>
<!-- Status Icons (Cellular, Wifi, Battery) -->
<div class="flex items-center space-x-1.5 text-neutral-900">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3.5" fill="currentColor" viewBox="0 0 17 12">
<path d="M1 10h2a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1zm4-3h2a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1zm4-3h2a1 1 0 0 0 1-1V1a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1zm4-3h2a1 1 0 0 0 1-1V-3a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1z"></path>
<rect height="3.5" rx="0.75" width="2.5" x="0.5" y="8"></rect>
<rect height="6" rx="0.75" width="2.5" x="4.5" y="5.5"></rect>
<rect height="8.5" rx="0.75" width="2.5" x="8.5" y="3"></rect>
<rect height="11" rx="0.75" width="2.5" x="12.5" y="0.5"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-3.5" fill="currentColor" viewBox="0 0 16 12">
<path d="M8 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM4.6 7.2a4.8 4.8 0 0 1 6.8 0 .8.8 0 0 0 1.1-1.1 6.4 6.4 0 0 0-9 0 .8.8 0 1 0 1.1 1.1zM2.1 4.7a8.4 8.4 0 0 1 11.8 0 .8.8 0 0 0 1.1-1.1 10 10 0 0 0-14 0 .8.8 0 0 0 1.1 1.1z"></path>
</svg>
<!-- Battery Icon -->
<div class="relative flex items-center">
<div class="w-5 h-2.5 border border-neutral-900 rounded-sm p-0.5 flex items-center">
<div class="w-full h-full bg-neutral-900 rounded-[1px]"></div>
</div>
<div class="w-0.5 h-1 bg-neutral-900 rounded-r-xs ml-0.5"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: NavigationBar -->
<nav class="px-5 pt-3 pb-2 flex items-center justify-between" data-purpose="top-navigation">
<button aria-label="Go Back" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-neutral-100 transition-colors -ml-1 text-neutral-800" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M15 18l-6-6 6-6"></path>
</svg>
</button>
<!-- Optional subtle step indicator matching flow context -->
<div class="flex items-center space-x-1.5" data-purpose="step-dots">
<div class="w-5 h-1 bg-coral rounded-full"></div>
<div class="w-5 h-1 bg-coral rounded-full"></div>
<div class="w-5 h-1 bg-coral rounded-full"></div>
<div class="w-1.5 h-1 bg-neutral-200 rounded-full"></div>
</div>
<!-- Spacer to balance back button -->
<div class="w-9 h-9"></div>
</nav>
<!-- END: NavigationBar -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-6 pt-3 pb-8 flex flex-col justify-between" data-purpose="main-flow-content">
<section>
<!-- Title and Subtitle Block -->
<header class="mb-7">
<h1 class="text-2xl font-bold tracking-tight text-neutral-900 mb-2">Verify ownership</h1>
<p class="text-[13px] leading-relaxed text-neutral-500 font-normal">Enter your name as per Aadhaar and upload both your Aadhaar card and a recent Electricity Bill (e.g. Bescom or local power utility).</p>
</header>
<!-- Form Fields Container -->
<form class="space-y-5" data-purpose="verification-form" onsubmit="event.preventDefault();">
<!-- Full Name Input Field -->
<div data-purpose="input-group">
<label class="block text-xs font-semibold text-neutral-600 mb-1.5" for="full-name">
              Full name (as per Aadhaar)
            </label>
<div class="relative">
<input class="w-full px-4 py-3.5 bg-neutral-50 border border-neutral-200 rounded-xl text-sm font-medium text-neutral-900 focus:outline-none focus:border-coral focus:ring-1 focus:ring-coral transition-colors" id="full-name" name="fullName" placeholder="Enter full name" type="text" value="Hari Karan">
</div>
</div>
<!-- Document Upload Area -->
<div class="space-y-4" data-purpose="upload-group">
  <div>
    <label class="block text-xs font-semibold text-neutral-600 mb-1.5">
      1. Aadhaar or Personal document
    </label>
    <label class="w-full flex items-center px-4 py-3 bg-neutral-50 border border-dashed border-neutral-300 hover:border-coral rounded-xl cursor-pointer group transition-all duration-200 active:scale-[0.99]" for="document-upload">
      <input accept=".pdf,.jpg,.jpeg,.png" class="hidden" id="document-upload" name="document" type="file">
      <div class="w-9 h-9 rounded-lg bg-white border border-neutral-200 flex items-center justify-center text-neutral-400 group-hover:text-coral transition-colors mr-3 shrink-0 shadow-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </div>
      <div class="flex flex-col text-left">
        <span class="text-xs font-medium text-neutral-800 group-hover:text-neutral-900 transition-colors">
          Upload Aadhaar or Personal ID</span>
        <span class="text-[11px] text-neutral-400 font-normal">
          PDF, JPG or PNG up to 10MB
        </span>
      </div>
    </label>
  </div>

  <div>
    <label class="block text-xs font-semibold text-neutral-600 mb-1.5">
      2. Utility or Property Proof&nbsp;</label>
    <label class="w-full flex items-center px-4 py-3 bg-neutral-50 border border-dashed border-neutral-300 hover:border-coral rounded-xl cursor-pointer group transition-all duration-200 active:scale-[0.99]" for="electricity-bill-upload">
      <input accept=".pdf,.jpg,.jpeg,.png" class="hidden" id="electricity-bill-upload" name="electricityBill" type="file">
      <div class="w-9 h-9 rounded-lg bg-white border border-neutral-200 flex items-center justify-center text-neutral-400 group-hover:text-coral transition-colors mr-3 shrink-0 shadow-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" x2="12" y1="3" y2="15"></line></svg>
      </div>
      <div class="flex flex-col text-left">
        <span class="text-xs font-medium text-neutral-800 group-hover:text-neutral-900 transition-colors">
          Upload recent electricity bill&nbsp;<span style="color: rgb(82, 82, 82); font-weight: 600; background-color: rgb(255, 255, 255);" class="">(Last 2 months)</span></span>
        <span class="text-[11px] text-neutral-400 font-normal">
          PDF, JPG or PNG up to 10MB
        </span>
      </div>
    </label>
  </div>
</div>
</form>
<!-- Security / Privacy Trust Callout -->
<div class="mt-6 flex items-start gap-2.5 p-3.5 rounded-xl bg-orange-50/50 border border-orange-100/70" data-purpose="trust-badge">
<div class="mt-0.5 text-coral shrink-0">
<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944zM11 14a1 1 0 11-2 0 1 1 0 012 0zm0-7a1 1 0 10-2 0v3a1 1 0 102 0V7z" fill-rule="evenodd"></path>
</svg>
</div>
<p class="text-[11px] leading-relaxed text-neutral-600">
            Your identity information is encrypted and securely stored. It will strictly be used for owner verification.
          </p>
</div>
</section>
<!-- Bottom Action Area -->
<footer class="pt-6" data-purpose="footer-action">
<button class="w-full py-4 px-6 bg-coral hover:bg-coral-600 active:bg-coral-600 text-white font-semibold text-sm rounded-2xl shadow-lg shadow-coral/25 transition-all duration-150 transform active:scale-[0.99] flex items-center justify-center tracking-wide" type="button">
          Submit for review
        </button>
</footer>
</main>
<!-- END: MainContent -->
<!-- BEGIN: iOSHomeIndicator -->
<div class="w-full pb-2 pt-1 flex justify-center items-center" data-purpose="ios-home-indicator">
<div class="w-32 h-1 bg-neutral-900 rounded-full"></div>
</div>
<!-- END: iOSHomeIndicator -->
</div>
<!-- END: MobileScreenContainer -->




</body></html>

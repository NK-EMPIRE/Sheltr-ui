<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Sheltr - Search</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#EF6844',
              coral: '#EF7560',
              hover: '#DE5632',
              light: '#FFF5F3',
            },
            keyboard: {
              bg: '#D1D5DB',
              key: '#FFFFFF',
              keyAlt: '#ACB2BA',
              keyShadow: '#898D93',
            }
          }
        }
      }
    };
  </script>
<style data-purpose="custom-layout">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    /* iOS keyboard key press effect */
    .key-btn {
      box-shadow: 0 1px 0 #898D93;
      transition: background-color 0.05s ease, transform 0.05s ease;
    }
    .key-btn:active {
      background-color: #CBD5E1;
      transform: translateY(1px);
    }
    .key-special:active {
      background-color: #FFFFFF;
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-0 sm:p-4">
<!-- BEGIN: PhoneContainer -->
<!-- iPhone 15 Pro frame wrapper -->
<main class="w-full max-w-[393px] h-[852px] bg-white rounded-[48px] shadow-2xl flex flex-col relative overflow-hidden border-[6px] border-neutral-900/10" data-purpose="mobile-screen-viewport">
<!-- BEGIN: iOSStatusBar -->
<!-- Top Status Bar (9:41 with Dynamic Island indicator & system icons) -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-20 shrink-0 select-none" data-purpose="ios-status-bar">
<!-- Time -->
<span class="text-sm font-semibold tracking-tight text-neutral-900">9:41</span>
<!-- Right Status Icons: Cell Signal, Wi-Fi, Battery -->
<div class="flex items-center space-x-1.5 text-neutral-900">
<!-- Cellular -->
<svg class="w-4 h-3 fill-current" viewBox="0 0 17 11">
<rect height="4" rx="0.5" width="2.5" x="0" y="7"></rect>
<rect height="6" rx="0.5" width="2.5" x="4" y="5"></rect>
<rect height="8.5" rx="0.5" width="2.5" x="8" y="2.5"></rect>
<rect height="11" rx="0.5" width="2.5" x="12" y="0"></rect>
</svg>
<!-- Wi-Fi -->
<svg class="w-3.5 h-3 fill-current" viewBox="0 0 16 12">
<path d="M8 2.8c2.6 0 5 1.1 6.7 2.8l1.3-1.3C13.8 2.1 11 1 8 1 5 1 2.2 2.1 0 4.3l1.3 1.3C3 3.9 5.4 2.8 8 2.8zm0 4.2c1.5 0 2.8.6 3.8 1.6l1.3-1.3C11.8 6 10 5.2 8 5.2s-3.8.8-5.1 2.1l1.3 1.3C5.2 7.6 6.5 7 8 7zm0 4.2c.8 0 1.5-.7 1.5-1.5s-.7-1.5-1.5-1.5-1.5.7-1.5 1.5.7 1.5 1.5 1.5z"></path>
</svg>
<!-- Battery -->
<div class="flex items-center">
<div class="w-5 h-[11px] border border-neutral-900 rounded-[3px] p-[1px] flex items-center">
<div class="h-full w-3.5 bg-neutral-900 rounded-[1.5px]"></div>
</div>
<div class="w-[1.5px] h-1 bg-neutral-900 rounded-r-full -ml-[0.5px]"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: SearchHeader -->
<!-- Back button and pre-filled search bar -->
<section class="px-4 pt-3 pb-2 shrink-0" data-purpose="search-header-bar">
<div class="flex items-center gap-2.5">
<!-- Back Chevron -->
<button aria-label="Go back" class="p-1.5 -ml-1 text-neutral-800 hover:text-neutral-500 rounded-full transition-colors" type="button">
<svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Search Input Wrapper -->
<div class="flex-1 relative flex items-center">
<input class="w-full bg-neutral-100/90 text-neutral-900 text-[14.5px] font-medium pl-3.5 pr-8 py-2.5 rounded-full border-none focus:ring-1 focus:ring-brand focus:bg-white outline-none" placeholder="Search city, area or project" readonly="" type="text" value="HSR Layout, Bangalore">
<!-- Clear/Cross Button inside input -->
<button aria-label="Clear text" class="absolute right-2.5 w-4 h-4 bg-neutral-300 hover:bg-neutral-400 rounded-full flex items-center justify-center text-white transition-colors" type="button">
<svg class="w-2.5 h-2.5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
</section>
<!-- END: SearchHeader -->
<!-- BEGIN: RecentSearchesSection -->
<!-- List of previous search queries with icon and tap feedback -->
<section class="flex-1 px-5 pt-4 overflow-y-auto" data-purpose="recent-searches-list">
<h2 class="text-xs font-bold uppercase tracking-wider text-neutral-400 mb-3">Recent searches</h2>
<div class="divide-y divide-neutral-100">
<!-- Search Item 1 -->
<div class="flex items-center py-3.5 group cursor-pointer active:opacity-60 transition-opacity">
<!-- Clock History Icon -->
<div class="w-8 h-8 rounded-full bg-neutral-50 flex items-center justify-center mr-3 shrink-0 text-neutral-400 group-hover:text-neutral-600">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[15px] font-medium text-neutral-800 flex-1">HSR Layout, Bangalore</span>
<svg class="w-4 h-4 text-neutral-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<!-- Search Item 2 -->
<div class="flex items-center py-3.5 group cursor-pointer active:opacity-60 transition-opacity">
<div class="w-8 h-8 rounded-full bg-neutral-50 flex items-center justify-center mr-3 shrink-0 text-neutral-400 group-hover:text-neutral-600">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[15px] font-medium text-neutral-800 flex-1">Koramangala</span>
<svg class="w-4 h-4 text-neutral-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<!-- Search Item 3 -->
<div class="flex items-center py-3.5 group cursor-pointer active:opacity-60 transition-opacity">
<div class="w-8 h-8 rounded-full bg-neutral-50 flex items-center justify-center mr-3 shrink-0 text-neutral-400 group-hover:text-neutral-600">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[15px] font-medium text-neutral-800 flex-1">Indiranagar</span>
<svg class="w-4 h-4 text-neutral-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<!-- Search Item 4 -->
<div class="flex items-center py-3.5 group cursor-pointer active:opacity-60 transition-opacity">
<div class="w-8 h-8 rounded-full bg-neutral-50 flex items-center justify-center mr-3 shrink-0 text-neutral-400 group-hover:text-neutral-600">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[15px] font-medium text-neutral-800 flex-1">Whitefield</span>
<svg class="w-4 h-4 text-neutral-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
</section>
<!-- END: RecentSearchesSection -->
<!-- BEGIN: iOSKeyboard -->
<!-- Native iOS Light Keyboard mockup with styled coral Search CTA -->
<footer class="w-full bg-[#CED2D9]/95 backdrop-blur-md pt-2 pb-5 px-1.5 shrink-0" data-purpose="ios-keyboard">
<div class="max-w-[375px] mx-auto space-y-2.5">
<!-- Row 1: q w e r t y u i o p -->
<div class="flex justify-between gap-1 px-1">
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">q</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">w</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">e</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">r</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">t</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">y</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">u</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">i</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">o</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">p</div>
</div>
<!-- Row 2: a s d f g h j k l -->
<div class="flex justify-center gap-1 px-4">
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">a</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">s</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">d</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">f</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">g</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">h</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">j</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">k</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">l</div>
</div>
<!-- Row 3: Shift + z x c v b n m + Backspace -->
<div class="flex justify-between gap-1 px-1">
<!-- Shift Key -->
<div class="key-btn key-special w-[42px] h-[42px] bg-[#ACB2BA] rounded-md flex items-center justify-center shadow">
<svg class="w-4 h-4 text-neutral-800" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 4.5l-7 7h4.5V19h5v-7.5H19l-7-7z"></path>
</svg>
</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">z</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">x</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">c</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">v</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">b</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">n</div>
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-lg font-normal text-neutral-900 shadow">m</div>
<!-- Backspace Key -->
<div class="key-btn key-special w-[42px] h-[42px] bg-[#ACB2BA] rounded-md flex items-center justify-center shadow">
<svg class="w-5 h-5 text-neutral-800" fill="currentColor" viewBox="0 0 24 24">
<path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"></path>
</svg>
</div>
</div>
<!-- Row 4: 123, Mic/Globe, Space, Search -->
<div class="flex justify-between items-center gap-1.5 px-1 pt-0.5">
<!-- 123 switch -->
<div class="key-btn key-special w-[46px] h-[42px] bg-[#ACB2BA] rounded-md flex items-center justify-center text-[15px] font-medium text-neutral-800 shadow">
            123
          </div>
<!-- Space bar -->
<div class="key-btn flex-1 h-[42px] bg-white rounded-md flex items-center justify-center text-[15px] font-normal text-neutral-500 shadow">
            space
          </div>
<!-- Coral Sheltr Search Action Button -->
<button class="key-btn w-[88px] h-[42px] bg-brand-coral hover:bg-brand text-white rounded-md flex items-center justify-center text-[15px] font-medium shadow active:scale-95 transition-all" type="button">
            search
          </button>
</div>
</div>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-neutral-900 rounded-full mx-auto mt-4 mb-0.5"></div>
</footer>
<!-- END: iOSKeyboard -->
</main>
<!-- END: PhoneContainer -->
</body></html>

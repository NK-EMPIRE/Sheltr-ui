<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Sheltr - 9. Map View</title>
<!-- Tailwind CSS CDN -->

<!-- Google Fonts & Material Symbols -->

<body class="bg-slate-100 flex items-center justify-center min-h-screen p-0 m-0">

<path d="M150 -20 C155 180 165 300 155 460 C145 600 160 720 170 860" fill="none" stroke="#e6dfd1" stroke-linecap="round" stroke-width="14"></path>

</div>
<!-- END: Full Map Vector Cartography Canvas -->
<!-- BEGIN: Floating Top Bar Section -->
<header class="relative z-30 pt-3 px-4 pb-2">
<!-- iOS Status Bar -->
<div class="flex justify-between items-center px-2 pt-1 pb-2 text-slate-800 text-xs font-semibold tracking-tight">
<span class="text-[14px] font-bold tracking-tight text-slate-900">9:41</span>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px] text-slate-800">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[16px] text-slate-800">wifi</span>
<div class="w-5 h-2.5 border border-slate-800 rounded-sm p-[1px] flex items-center ml-0.5">
<div class="h-full w-3 bg-slate-900 rounded-2xs"></div>
</div>
</div>
</div>
<!-- Floating Frosted Glass Search Bar Container -->
<div class="mt-0.5 flex items-center bg-white/90 backdrop-blur-md border border-white/80 rounded-2xl shadow-sm px-3 py-2.5 gap-2.5">
<!-- Back Button -->
<button aria-label="Go back" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-700 hover:text-slate-900 hover:bg-slate-100 transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<!-- Search Icon & Input -->
<div class="flex-1 flex items-center gap-2 min-w-0">
<span class="material-symbols-outlined text-[20px] text-[#ef7560] flex-shrink-0">location_on</span>
<input class="w-full bg-transparent border-none p-0 text-slate-900 text-[14px] font-semibold tracking-tight focus:ring-0 focus:outline-none cursor-pointer truncate" readonly="" type="text" value="HSR Layout, Bangalore">
</div>
<!-- Filter Button -->
<button aria-label="Filter search" class="w-8 h-8 rounded-xl bg-slate-100/90 flex items-center justify-center text-slate-700 hover:text-slate-900 transition-colors flex-shrink-0 shadow-2xs">
<span class="material-symbols-outlined text-[18px]">tune</span>
</button>
</div>
</header>
<!-- END: Floating Top Bar Section -->
<!-- BEGIN: Interactive Map Pins Layer -->
<div class="absolute inset-0 pointer-events-none z-10">
<!-- Marker 1: ₹18,000 (North-West) -->
<div class="absolute top-[215px] left-[45px] pointer-events-auto flex items-center group cursor-pointer transition-transform hover:scale-105 active:scale-95">
<div class="bg-white/95 backdrop-blur-md px-3 py-1.5 rounded-full shadow-[0_4px_16px_rgba(0,0,0,0.1)] border border-white/90 flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-[#ef7560]"></span>
<span class="text-[12px] font-bold text-slate-800 tracking-tight whitespace-nowrap">₹18,000</span>
</div>
</div>
<!-- Marker 2: ₹22,000 (North-East) -->
<div class="absolute top-[235px] right-[40px] pointer-events-auto flex items-center group cursor-pointer transition-transform hover:scale-105 active:scale-95">
<div class="bg-white/95 backdrop-blur-md px-3 py-1.5 rounded-full shadow-[0_4px_16px_rgba(0,0,0,0.1)] border border-white/90 flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-[#ef7560]"></span>
<span class="text-[12px] font-bold text-slate-800 tracking-tight whitespace-nowrap">₹22,000</span>
</div>
</div>
<!-- Marker 3: ₹25,000 (West-Mid) -->
<div class="absolute top-[340px] left-[35px] pointer-events-auto group cursor-pointer transition-transform hover:scale-105 active:scale-95">
<div class="bg-white/95 backdrop-blur-md px-3 py-1.5 rounded-full shadow-[0_4px_16px_rgba(0,0,0,0.1)] border border-white/90 flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-[#ef7560]"></span>
<span class="text-[12px] font-bold text-slate-800 tracking-tight whitespace-nowrap">₹25,000</span>
</div>
</div>
<!-- Active Selected Pin: ₹32,000 Speech Bubble with Coral Pulse (Center) -->
<div class="absolute top-[270px] left-[155px] pointer-events-auto flex flex-col items-center cursor-pointer z-20 transition-transform active:scale-95">
<!-- Coral pulse animation ring behind pin -->
<div class="absolute -top-1 -left-1 w-[96px] h-[38px] rounded-full bg-[#ef7560]/25 animate-ping pointer-events-none"></div>
<!-- Speech Bubble Badge -->
<div class="relative bg-[#ef7560] text-white font-extrabold px-3.5 py-1.5 rounded-full shadow-lg shadow-[#ef7560]/40 text-[12.5px] border-2 border-white ring-4 ring-[#ef7560]/20 flex items-center gap-1.5 z-10 whitespace-nowrap">
<span class="w-2 h-2 rounded-full bg-white"></span>
<span class="tracking-tight">₹32,000</span>
</div>
<!-- Downward triangle pointer -->
<div class="w-2.5 h-2.5 bg-[#ef7560] rotate-45 -mt-1.5 rounded-[1px] border-r-2 border-b-2 border-white z-10"></div>
</div>
<!-- User Current GPS Location (iOS blue pulse) -->
<div class="absolute top-[410px] left-[190px] flex items-center justify-center pointer-events-none">
<div class="absolute w-8 h-8 bg-blue-500/25 rounded-full animate-ping"></div>
<div class="relative w-4 h-4 bg-blue-500 border-2 border-white rounded-full shadow-md ring-4 ring-blue-500/20"></div>
</div>
<!-- Secondary amenity badge -->
<div class="absolute top-[375px] right-[65px] pointer-events-auto cursor-pointer transition-transform hover:scale-110">
<div class="w-8 h-8 rounded-full bg-white/95 backdrop-blur-sm border border-white shadow-md flex items-center justify-center text-[#ef7560]">
<span class="material-symbols-outlined text-[17px]">apartment</span>
</div>
</div>
</div>
<!-- END: Interactive Map Pins Layer -->
<!-- BEGIN: Bottom Controls & Property Preview Card -->
<footer class="relative z-30 px-4 pb-4 flex flex-col items-center gap-2.5">
<!-- Selected Property Preview Card -->
<div class="w-full bg-white/95 backdrop-blur-xl border border-white/90 rounded-2xl p-3 shadow-lg flex items-center gap-3 cursor-pointer transition-transform active:scale-[0.99]" data-purpose="property-preview-card">
<!-- Thumbnail -->
<div class="w-22 h-22 w-[88px] h-[88px] rounded-xl overflow-hidden bg-slate-100 flex-shrink-0 relative shadow-xs">

<span class="material-symbols-outlined text-[10px] text-amber-300">star</span>
<span class="text-[10px] font-bold text-white leading-none">4.9</span>
</div>
</div>
<!-- Property Details -->
<div class="flex-1 min-w-0 pr-0.5">
<div class="flex items-center gap-1.5 mb-1">
<span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200/60 leading-none">Verified</span>
<span class="text-[11px] text-slate-500 font-medium truncate">HSR Layout, Sector 2</span>
</div>
<h3 class="text-[15px] font-bold text-slate-900 truncate leading-tight tracking-tight">2 BHK Apartment</h3>
<p class="text-[11.5px] text-slate-500 font-medium truncate mt-0.5">
            2 Bed · 2 Bath · 1,100 sq ft
          </p>
<div class="mt-1 flex items-baseline gap-1">
<span class="text-[15px] font-extrabold text-[#ef7560] tracking-tight">₹32,000</span>
<span class="text-[11px] text-slate-500 font-medium">/ month</span>
</div>
</div>
<!-- Chevron Action Button -->
<div class="w-7 h-7 rounded-full bg-slate-100/90 flex items-center justify-center text-slate-400 flex-shrink-0">
<span class="material-symbols-outlined text-[18px]">chevron_right</span>
</div>
</div>
<!-- Floating Bottom Dock: Map/List View Toggle -->
<div class="bg-white/95 backdrop-blur-2xl border border-white/90 shadow-[0_8px_30px_rgba(0,0,0,0.12)] p-1 rounded-full flex items-center gap-1" data-purpose="view-toggle">

<button class="flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-[#ef7560] text-white text-[12px] font-bold shadow-sm transition-all">
<span class="material-symbols-outlined text-[16px]">map</span>
<span>Map</span>
</button>
<!-- List Option -->
<button class="flex items-center gap-1.5 px-4 py-1.5 rounded-full text-slate-600 hover:text-slate-900 text-[12px] font-semibold transition-colors">
<span class="material-symbols-outlined text-[16px] text-slate-400">format_list_bulleted</span>
<span>List</span>
</button>
</div>

<div class="w-32 h-1 bg-slate-300 rounded-full mt-0.5"></div>

</div>

<!DOCTYPE html><html lang="en"><head>

<div class="flex-1 flex items-center justify-center py-2 px-3 bg-slate-50 border border-slate-100 rounded-xl text-xs font-semibold text-slate-700 space-x-1.5">
<span class="">🚿</span>
<span class="">1 Bath</span>
</div>
<div class="flex-1 flex items-center justify-center py-2 px-3 bg-slate-50 border border-slate-100 rounded-xl text-xs font-semibold text-slate-700 space-x-1.5">
<span class="">📐</span>
<span class="">700 sq ft</span>
</div>
</div>

<span class="px-3.5 py-1.5 bg-slate-100/90 text-slate-600 rounded-lg text-xs font-medium tracking-tight">

<span class="px-3.5 py-1.5 bg-slate-100/90 text-slate-600 rounded-lg text-xs font-medium tracking-tight">
            Parking
          </span>
<span class="px-3.5 py-1.5 bg-slate-100/90 text-slate-600 rounded-lg text-xs font-medium tracking-tight">

<!-- BEGIN: PropertyDescription -->

<p class="text-sm leading-relaxed text-slate-600">

<button class="flex-1 h-12 flex items-center justify-center px-4 rounded-full bg-brand-500 hover:bg-brand-600 text-white font-semibold text-[15px] tracking-tight shadow-md shadow-brand-500/25 active:scale-95 transition-all" type="button"><span class="">View owner contact</span></button>
</div>
<!-- Home Indicator Bar for iOS -->
<div class="w-32 h-1 bg-slate-300 rounded-full mx-auto mt-3 pointer-events-none"></div>

<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Sheltr - Account Details</title>
<!-- Load Tailwind CSS with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sheltr: {
              coral: '#F06449',
              'coral-hover': '#e3553a',
              'coral-light': '#FDEEEB',
              heading: '#1C1917',
              muted: '#78716C',
              placeholder: '#A8A29E',
              border: '#E7E5E4',
              inputBg: '#FAFAF9',
              bg: '#FDFCFB'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'San Francisco', 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', 'sans-serif'],
          }
        }
      }
    };
  </script>
<style data-purpose="base-typography">
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body class="bg-stone-100 min-h-screen flex items-center justify-center p-0 sm:p-4 text-sheltr-heading selection:bg-sheltr-coral selection:text-white">
<!-- BEGIN: MobileDeviceContainer -->
<!-- iPhone 14/15 inspired container with 390px base width -->
<div class="relative w-full max-w-[390px] h-[844px] bg-[#FAF8F5] sm:rounded-[48px] shadow-2xl flex flex-col justify-between overflow-hidden border border-stone-200/80">
<!-- BEGIN: TopStatusBarAndHeader -->
<header class="w-full pt-3 px-6 select-none shrink-0">
<!-- iOS Status Bar -->
<div class="flex justify-between items-center h-8 text-[14px] font-semibold tracking-tight text-neutral-900 mb-1">
<span class="pl-2">9:41</span>
<div class="flex items-center space-x-1.5 pr-2">
<!-- Signal Icon -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 17 12">
<rect height="4" rx="0.8" width="3" x="0" y="8"></rect>
<rect height="6.5" rx="0.8" width="3" x="4.5" y="5.5"></rect>
<rect height="9" rx="0.8" width="3" x="9" y="3"></rect>
<rect height="11.5" rx="0.8" width="3" x="13.5" y="0.5"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 16 12">
<path d="M8 2.8C5.2 2.8 2.7 3.9 0.8 5.8L0 4.9C2.2 2.7 5 1.5 8 1.5C11 1.5 13.8 2.7 16 4.9L15.2 5.8C13.3 3.9 10.8 2.8 8 2.8ZM8 6.4C6.2 6.4 4.5 7.1 3.2 8.4L2.4 7.6C3.9 6.1 5.9 5.2 8 5.2C10.1 5.2 12.1 6.1 13.6 7.6L12.8 8.4C11.5 7.1 9.8 6.4 8 6.4ZM9.6 10.8C9.6 11.7 8.9 12.4 8 12.4C7.1 12.4 6.4 11.7 6.4 10.8C6.4 9.9 7.1 9.2 8 9.2C8.9 9.2 9.6 9.9 9.6 10.8Z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 rounded-[3.5px] border border-black/80 p-0.5 flex items-center relative">
<div class="w-full h-full bg-black rounded-[1.5px]"></div>
<div class="absolute -right-1 top-0.5 bottom-0.5 w-[1.5px] bg-black/80 rounded-r-sm"></div>
</div>
</div>
</div>
<!-- Navigation & Step Indicator -->
<nav aria-label="Step navigation" class="relative flex items-center justify-between mt-2 h-11">
<!-- Back Button -->
<button aria-label="Go back" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-neutral-800 hover:bg-neutral-200/50 transition-colors" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M15 19l-7-7 7-7"></path>
</svg>
</button>
<!-- Segmented Stepper Bar -->
<div aria-label="Registration Progress" aria-valuemax="4" aria-valuemin="1" aria-valuenow="1" class="flex items-center gap-1.5" role="progressbar">
<!-- Step 1 (Active) -->
<div class="w-5 h-1 rounded-full bg-sheltr-coral"></div>
<!-- Step 2 -->
<div class="w-5 h-1 rounded-full bg-stone-300"></div>
<!-- Step 3 -->
<div class="w-5 h-1 rounded-full bg-stone-300"></div>
<!-- Step 4 -->
<div class="w-5 h-1 rounded-full bg-stone-300"></div>
</div>
<!-- Balance spacer for symmetric centering -->
<div class="w-10"></div>
</nav>
</header>
<!-- END: TopStatusBarAndHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-6 pt-5 pb-6 flex flex-col justify-between">
<div>
<!-- Heading & Subtitle -->
<header class="space-y-2 mb-8">
<h1 class="text-[27px] font-bold text-stone-900 tracking-tight leading-snug">
            How can we<br>reach you?
          </h1>
<p class="text-[14.5px] text-stone-500 font-normal leading-relaxed pr-2">
            We'll send a one-time code to confirm your number.
          </p>
</header>
<!-- Account Form -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="space-y-2">
<label class="block text-xs font-semibold uppercase tracking-wider text-stone-600" for="fullName">
              Full name
            </label>
<div class="relative">
<input class="w-full h-13 px-4 py-3.5 bg-white border border-stone-200 rounded-2xl text-[15.5px] font-medium text-stone-800 placeholder-stone-400 focus:outline-none focus:border-sheltr-coral focus:ring-1 focus:ring-sheltr-coral shadow-sm transition-all" id="fullName" name="fullName" placeholder="Your Name" type="text" value="">
</div>
</div>
<!-- Mobile Number Field -->
<div class="space-y-2">
<label class="block text-xs font-semibold uppercase tracking-wider text-stone-600" for="mobileNumber">
              Mobile number
            </label>
<div class="relative flex items-center bg-white border border-stone-200 rounded-2xl shadow-sm focus-within:border-sheltr-coral focus-within:ring-1 focus-within:ring-sheltr-coral transition-all overflow-hidden">
<!-- Country Code Section -->
<div class="flex items-center pl-4 pr-3.5 text-[15.5px] font-medium text-stone-800 select-none">
<span class="">+91</span>
</div>
<!-- Subtle Divider Line -->
<div class="h-6 w-[1px] bg-stone-200"></div>
<!-- Phone Number Input -->
<input class="w-full h-13 px-3.5 py-3.5 bg-transparent border-0 text-[15.5px] font-medium text-stone-800 placeholder-stone-400 focus:ring-0 focus:outline-none tracking-wide" id="mobileNumber" name="mobileNumber" placeholder="Your Mobile Number" type="tel" value="">
</div>
</div>
</form>
</div>
<!-- Action Section & Legal Notice -->
<footer class="mt-auto pt-6 flex flex-col items-center">
<!-- Submit Button -->
<button class="w-full h-14 bg-sheltr-coral hover:bg-sheltr-coral-hover text-white text-[16.5px] font-bold rounded-2xl shadow-[0_8px_20px_rgba(240,100,73,0.32)] active:scale-[0.99] transition-all flex items-center justify-center mb-5 tracking-wide" type="submit">
          Send code
        </button>
<!-- Terms and Conditions Text -->
<p class="text-[12px] text-center text-stone-500 leading-relaxed max-w-[270px]">
          By continuing, you agree to Sheltr's 
          <a class="text-sheltr-coral font-medium underline underline-offset-2 hover:opacity-80" href="#">Terms</a> and 
          <a class="text-sheltr-coral font-medium underline underline-offset-2 hover:opacity-80" href="#">Privacy Policy</a>.
        </p>
</footer>
</main>
<!-- END: MainContent -->
<!-- BEGIN: HomeIndicator -->
<!-- iOS Home Indicator -->
<div class="w-full pb-2 pt-1 flex justify-center shrink-0">
<div class="w-32 h-1 bg-stone-900/80 rounded-full"></div>
</div>
<!-- END: HomeIndicator -->
</div>
<!-- END: MobileDeviceContainer -->


</body></html>

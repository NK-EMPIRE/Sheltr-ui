<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Sheltr - OTP Verification</title>
<!-- Tailwind CSS v3 CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#EF7560',
              hover: '#E26550',
              light: '#FDEEEB',
              muted: '#F6A89B'
            },
            surface: {
              bg: '#FAF7F5',
              card: '#FFFFFF',
              input: '#FAFAFA'
            },
            neutral: {
              heading: '#1C1917',
              subtext: '#78716C',
              border: '#E7E5E4'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'SF Pro Display', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Mobile Device Preview & Component Polish -->
<style data-purpose="custom-styling">
    body {
      background-color: #E5E7EB;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-container {
      width: 100%;
      max-width: 393px;
      height: 852px;
      background-color: #FAF7F5;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="p-0 sm:p-4">
<!-- BEGIN: MobileDeviceFrame -->
<main class="mobile-container sm:rounded-[48px] select-none" data-purpose="mobile-screen-wrapper">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-7 flex justify-between items-center text-neutral-heading z-20" data-purpose="ios-status-bar">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight">9:41</span>
<!-- Status Icons (Cellular, WiFi, Battery) -->
<div class="flex items-center space-x-1.5 text-neutral-heading">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3.5 fill-current" fill="none" viewBox="0 0 17 11" xmlns="http://www.w3.org/2000/svg">
<rect height="3" rx="0.5" width="2.5" x="0.5" y="8"></rect>
<rect height="5.5" rx="0.5" width="2.5" x="5" y="5.5"></rect>
<rect height="8" rx="0.5" width="2.5" x="9.5" y="3"></rect>
<rect height="10.5" rx="0.5" width="2.5" x="14" y="0.5"></rect>
</svg>
<!-- WiFi Icon -->
<svg class="w-4 h-3.5 fill-current" fill="none" viewBox="0 0 16 12" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M8 2.4C10.6 2.4 13 3.5 14.7 5.2L16 3.9C13.9 1.8 11.1 0.5 8 0.5C4.9 0.5 2.1 1.8 0 3.9L1.3 5.2C3 3.5 5.4 2.4 8 2.4ZM8 6.2C9.6 6.2 11 6.8 12.1 7.9L13.4 6.6C12 5.2 10.1 4.3 8 4.3C5.9 4.3 4 5.2 2.6 6.6L3.9 7.9C5 6.8 6.4 6.2 8 6.2ZM9.8 10.3C9.8 11.3 9 12.1 8 12.1C7 12.1 6.2 11.3 6.2 10.3C6.2 9.3 7 8.5 8 8.5C9 8.5 9.8 9.3 9.8 10.3Z" fill-rule="evenodd"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 rounded-full border border-neutral-heading flex items-center p-0.5 relative">
<div class="h-full w-4 bg-neutral-heading rounded-full"></div>
<div class="w-0.5 h-1.5 bg-neutral-heading absolute -right-1 top-1/2 -translate-y-1/2 rounded-r-xs"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopNavigationBar -->
<nav class="w-full pt-4 pb-2 px-6 flex items-center relative" data-purpose="top-navigation">
<!-- Back Chevron Button -->
<button aria-label="Go back" class="w-9 h-9 rounded-full flex items-center justify-center text-neutral-800 hover:bg-black/5 active:scale-95 transition-all" type="button">
<svg class="w-5 h-5 stroke-[2.2] stroke-current" fill="none" viewBox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Stepper Progress Bar (Centered 4 Segments, Step 2 Active) -->
<div class="absolute left-1/2 -translate-x-1/2 flex items-center space-x-1.5" data-purpose="onboarding-stepper">
<!-- Step 1: Inactive / Completed -->
<span class="w-4 h-1 rounded-full bg-[#E8DDD8]"></span>
<!-- Step 2: Active (Coral) -->
<span class="w-6 h-1 rounded-full bg-brand"></span>
<!-- Step 3: Inactive -->
<span class="w-4 h-1 rounded-full bg-[#E8DDD8]"></span>
<!-- Step 4: Inactive -->
<span class="w-4 h-1 rounded-full bg-[#E8DDD8]"></span>
</div>
</nav>
<!-- END: TopNavigationBar -->
<!-- BEGIN: MainContent -->
<div class="flex-1 flex flex-col justify-between px-6 pt-7 pb-8" data-purpose="main-content-flow">
<!-- Top Section: Titles & Inputs -->
<div>
<!-- Heading and Subtext Group -->
<div class="space-y-1.5" data-purpose="header-text-group">
<h1 class="text-[26px] font-bold text-neutral-heading tracking-tight leading-snug">
            Enter the code
          </h1>
<p class="text-[14px] text-neutral-subtext leading-normal">
            We've sent a 6-digit code to
          </p>
<div class="flex items-center space-x-1.5 text-[14px]">
<span class="text-neutral-subtext font-medium">+91 67298 20972.</span>
<button class="text-brand font-semibold hover:underline focus:outline-none" type="button">
              Change
            </button>
</div>
</div>
<!-- 6-Digit OTP Boxes -->
<div class="mt-8 flex justify-between items-center gap-2" data-purpose="otp-input-group"><!-- Box 1: 4 -->
<div class="flex-1 h-14 bg-red-50/50 rounded-2xl border-2 border-red-500 shadow-sm flex items-center justify-center transition-all">
<span class="text-xl font-semibold text-red-500">4</span>
</div>
<!-- Box 2: 7 -->
<div class="flex-1 h-14 bg-red-50/50 rounded-2xl border-2 border-red-500 shadow-sm flex items-center justify-center transition-all">
<span class="text-xl font-semibold text-red-500">7</span>
</div>
<!-- Box 3: 0 -->
<div class="flex-1 h-14 bg-red-50/50 rounded-2xl border-2 border-red-500 shadow-sm flex items-center justify-center transition-all">
<span class="text-xl font-semibold text-red-500">0</span>
</div>
<!-- Box 4: 2 -->
<div class="flex-1 h-14 bg-red-50/50 rounded-2xl border-2 border-red-500 shadow-sm flex items-center justify-center transition-all">
<span class="text-xl font-semibold text-red-500">2</span>
</div>
<!-- Box 5: 7 -->
<div class="flex-1 h-14 bg-red-50/50 rounded-2xl border-2 border-red-500 shadow-sm flex items-center justify-center transition-all">
<span class="text-xl font-semibold text-red-500">7</span>
</div>
<!-- Box 6: 1 -->
<div class="flex-1 h-14 bg-red-50/50 rounded-2xl border-2 border-red-500 shadow-sm flex items-center justify-center transition-all">
<span class="text-xl font-semibold text-red-500">1</span>
</div></div>
<!-- Resend Code Timer -->
<div class="mt-6 h-10 flex items-center justify-center">
<div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-red-50 text-red-500 border border-red-100 text-[13px] font-medium">
<svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
<circle cx="12" cy="12" r="9" stroke-width="2"></circle>
<line x1="12" y1="8" x2="12" y2="12" stroke-width="2" stroke-linecap="round"></line>
<circle cx="12" cy="16" r="1" fill="currentColor"></circle>
</svg>
<span class="">Incorrect OTP. 2 attempts remaining.</span>
</div>
</div><div class="mt-4 flex flex-col items-center gap-4">
<button class="w-full py-4 bg-brand hover:bg-brand-hover active:scale-[0.99] text-white font-medium text-[15px] rounded-full shadow-[0_8px_20px_-4px_rgba(239,117,96,0.35)] transition duration-150 ease-in-out text-center" type="button">Verify &amp; continue</button>
<p class="text-[13px] text-neutral-subtext font-normal">
Didn't receive the code? <button class="text-brand font-semibold hover:underline focus:outline-none" type="button">Resend code</button>
</p>
</div>
</div>
<!-- Bottom Action Section -->
<div class="w-full space-y-7" data-purpose="bottom-action-container">
<!-- Verify & Continue Button -->
<!-- iOS Home Indicator -->
<div class="w-full flex justify-center pb-1">
<div class="w-32 h-1 bg-neutral-900 rounded-full opacity-90"></div>
</div>
</div>
</div>
<!-- END: MainContent -->
</main>
<!-- END: MobileDeviceFrame -->


</body></html>
